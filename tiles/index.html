<html>
    <head>
    </head>
<body>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.19.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>

    <div id="map" style="height: 1000px"></div>
        <script type="module">
           let protocol = new pmtiles.Protocol({metadata: true});
           maplibregl.addProtocol("pmtiles", protocol.tile);

            const map = new maplibregl.Map({
                container: 'map', // container id
                style: {
                    version: 8,
                    sources: {
                        'tiles': { //source name, must match in layers below
                            type: 'vector',
                            url: 'pmtiles://data/output4.pmtiles' //path to pmtiles file
                    }
                    },
                    layers: [
                        {
                            'id': 'background',
                            'type': 'background',
                            'paint': { 'background-color': '#112947'}
                    },
                    {
                        'id': 'streets', //must match id in pmtiles, use https://pmtiles.io/ to inspect your pmtiles file
                        'source':'tiles', //must match name above under 'sources'
                        'source-layer':'streets',
                        'type': 'line',
                        'paint': { 'line-color': '#406D99' }
                    },
                    {
                        'id': 'building',
                        'source':'tiles',
                        'source-layer':'building',
                        'type': 'fill',
                        'paint': { 'fill-color': '#21446B' }
                    },
                    {
                        'id': 'str',
                        'source':'tiles',
                        'source-layer': 'str',
                        'type': 'circle',
                        'paint': { 'circle-color': '#F21FBC' }
                    }
                    // add more layers as needed — each uses the same source, different 'source-layer'
                    ]
                },
                center: [-84.50427, 38.03888], // starting position [lng, lat]
                zoom: 12 // starting zoom
            });

            map.on('click', 'str', (e) => {
                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const description = e.features[0].properties.address; //must match details in pmtiles file, use https://pmtiles.io/ to view

                    // Ensure that if the map is zoomed out such that multiple
                    // copies of the feature are visible, the popup appears
                    // over the copy being pointed to.
                    while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                        coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                    }

                    new maplibregl.Popup()
                        .setLngLat(coordinates)
                        .setHTML(description)
                        .addTo(map);
                });

                // Change the cursor to a pointer when the mouse is over the str layer.
                map.on('mouseenter', 'str', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });

                // Change it back to a pointer when it leaves.
                map.on('mouseleave', 'str', () => {
                    map.getCanvas().style.cursor = '';
                });
        </script>
</body>
</html>
