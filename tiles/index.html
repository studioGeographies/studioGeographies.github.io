<html>
    <head>
    </head>
<body>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.19.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>

    <div id="map" style="height: 1000px"></div>
        <script type="module">
           // import * as pmtiles from 'https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js';
           // import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.19.0/dist/maplibre-gl.mjs';
           let protocol = new pmtiles.Protocol({metadata: true});
           maplibregl.addProtocol("pmtiles", protocol.tile);

            const map = new maplibregl.Map({
                container: 'map', // container id
                style: {
                    version: 8,
                    sources: {
                        'tiles': {
                            type: 'vector',
                            url: 'pmtiles://https://studiogeographies.github.io/tiles/data/output3.pmtiles'
                    }
                    },
                    layers: [
                    {
                        'id': 'str',
                        'source':'tiles',
                        'source-layer': 'str',
                        'type': 'circle',
                        'paint': { 'circle-color': '#f8f4f0' }
                    },
                    {
                        'id': 'streets',
                        'source':'tiles',
                        'source-layer':'streets',
                        'type': 'line',
                        'paint': { 'line-color': '#a0c8f0' }
                    }
                    // add more layers as needed — each uses the same source, different 'source-layer'
                    ]
                },
                center: [-84.5, 38], // starting position [lng, lat]
                zoom: 5 // starting zoom
            });
        </script>
</body>
</html>
